AWSTemplateFormatVersion: "2010-09-09"

Description: >-
  Porter (3D Tiles tile server) standalone stack for MS3 Test/Production.
  Creates a 2-AZ VPC, NAT egress, S3 gateway endpoint, ECS Fargate service behind
  an internet-facing (CIDR-allowlisted) ALB, IAM roles, and CloudWatch logs.
  Porter-only: no DRS, workers, Grafana, CloudFront, S3 Express, RDS, or scratch bucket.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: "Environment" }
        Parameters: [EnvironmentName, VpcCidr, HighAvailabilityNat]
      - Label: { default: "Porter container" }
        Parameters: [PorterImageUri, CorsOrigin, BlockCacheSize, TaskCpu, TaskMemory, DesiredCount]
      - Label: { default: "Storage" }
        Parameters: [AssetsBucketName, CreateAssetsBucket, LayerConfigPrefix, OutputBucketName]
      - Label: { default: "Network access" }
        Parameters: [AllowedClientCidr1, AllowedClientCidr2, AllowedClientCidr3]
      - Label: { default: "Health check / logging" }
        Parameters: [HealthCheckPath, HealthCheckMatcher, LogRetentionInDays]

Parameters:
  EnvironmentName:
    Type: String
    AllowedValues: [test, prod]
    Description: Deployment tier. Used in resource names and tags.

  VpcCidr:
    Type: String
    Default: 10.60.0.0/16
    AllowedPattern: ^(\d{1,3}\.){3}\d{1,3}/(1[6-9]|2[0-2])$
    Description: >-
      VPC CIDR, /16 to /22. Four equal /24 subnets are carved from it,
      so anything smaller than /22 will not fit.

  HighAvailabilityNat:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >-
      false = one NAT gateway (cheaper, single point of failure for egress).
      true = one NAT gateway per AZ. Recommend true for prod.

  PorterImageUri:
    Type: String
    Default: ghcr.io/mappend-io/porter:sha-2bcd898
    Description: Porter container image URI.

  CorsOrigin:
    Type: String
    Default: "*"
    Description: Value for CORS_ORIGIN.

  BlockCacheSize:
    Type: String
    Default: 8GiB
    Description: Value for BLOCK_CACHE_SIZE. Must fit inside TaskMemory.

  TaskCpu:
    Type: String
    Default: "4096"
    AllowedValues: ["1024", "2048", "4096", "8192", "16384"]
    Description: Fargate task CPU units. Dev Comingle uses 4096.

  TaskMemory:
    Type: String
    Default: "16384"
    Description: Fargate task memory in MiB. Dev Comingle uses 16384.

  DesiredCount:
    Type: Number
    Default: 1
    MinValue: 0
    MaxValue: 10
    Description: Number of Porter tasks.

  AssetsBucket:
    Type: String
    AllowedPattern: ^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$
    Description: S3 bucket holding layer configs and tile content.

  CreateAssetsBucket:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: true = this stack creates AssetsBucket. false = bucket already exists.

  LayerConfigPrefix:
    Type: String
    Default: comingle/layer_configs/
    Description: Key prefix for layer configs. Must end with a slash.

  OutputBucket:
    Type: String
    Default: ""
    Description: Optional second bucket the task role may read/write. Leave blank to skip.

  AllowedClientCidr1:
    Type: String
    AllowedPattern: ^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$
    Description: Required client CIDR allowed to reach the ALB on port 80.

  AllowedClientCidr2:
    Type: String
    Default: ""
    AllowedPattern: ^$|^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$
    Description: Optional second client CIDR.

  AllowedClientCidr3:
    Type: String
    Default: ""
    AllowedPattern: ^$|^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$
    Description: Optional third client CIDR.

  HealthCheckPath:
    Type: String
    Default: /layers
    Description: ALB target group health check path.

  HealthCheckMatcher:
    Type: String
    Default: 200-399
    Description: HTTP codes treated as healthy.

  LogRetentionInDays:
    Type: Number
    Default: 30
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365, 400, 545, 731, 1827, 3653]
    Description: CloudWatch Logs retention for the Porter log group.

Conditions:
  CreateBucket: !Equals [!Ref CreateAssetsBucket, "true"]
  HasOutputBucket: !Not [!Equals [!Ref OutputBucketName, ""]]
  HasCidr2: !Not [!Equals [!Ref AllowedClientCidr2, ""]]
  HasCidr3: !Not [!Equals [!Ref AllowedClientCidr3, ""]]
  MultiNat: !Equals [!Ref HighAvailabilityNat, "true"]

Resources:

  # ------------------------------------------------------------------ network

  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - { Key: Name, Value: !Sub "porter-${EnvironmentName}-vpc" }

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - { Key: Name, Value: !Sub "porter-${EnvironmentName}-igw" }

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Select [0, !Cidr [!Ref VpcCidr, 4, 8]]
      MapPublicIpOnLaunch: true
      Tags:
        - { Key: Name, Value: !Sub "porter-${EnvironmentName}-public-1" }

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Select [1, !Cidr [!Ref VpcCidr, 4, 8]]
      MapPublicIpOnLaunch: true
      Tags:
        - { Key: Name, Value: !Sub "porter-${EnvironmentName}-public-2" }

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Select [2, !Cidr [!Ref VpcCidr, 4, 8]]
      Tags:
        - { Key: Name, Value: !Sub "porter-${EnvironmentName}-private-1" }

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Select [3, !Cidr [!Ref VpcCidr, 4, 8]]
      Tags:
        - { Key: Name, Value: !Sub "porter-${EnvironmentName}-private-2" }

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - { Key: Name, Value: !Sub "porter-${EnvironmentName}-public-rt" }

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  NatEip1:
    Type: AWS::EC2::EIP
    DependsOn: InternetGatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - { Key: Name, Value: !Sub "porter-${EnvironmentName}-nat-eip-1" }

  NatGateway1:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEip1.AllocationId
      SubnetId: !Ref PublicSubnet1
      Tags:
        - { Key: Name, Value: !Sub "porter-${EnvironmentName}-nat-1" }

  NatEip2:
    Type: AWS::EC2::EIP
    Condition: MultiNat
    DependsOn: InternetGatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - { Key: Name, Value: !Sub "porter-${EnvironmentName}-nat-eip-2" }

  NatGateway2:
    Type: AWS::EC2::NatGateway
    Condition: MultiNat
    Properties:
      AllocationId: !GetAtt NatEip2.AllocationId
      SubnetId: !Ref PublicSubnet2
      Tags:
        - { Key: Name, Value: !Sub "porter-${EnvironmentName}-nat-2" }

  PrivateRouteTable1:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - { Key: Name, Value: !Sub "porter-${EnvironmentName}-private-rt-1" }

  PrivateRouteTable2:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - { Key: Name, Value: !Sub "porter-${EnvironmentName}-private-rt-2" }

  PrivateDefaultRoute1:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable1
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway1

  PrivateDefaultRoute2:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable2
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !If [MultiNat, !Ref NatGateway2, !Ref NatGateway1]

  PrivateSubnet1RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable1

  PrivateSubnet2RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable2

  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref PrivateRouteTable1
        - !Ref PrivateRouteTable2

  # ------------------------------------------------------------------ storage

  AssetsBucket:
    Type: AWS::S3::Bucket
    Condition: CreateBucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref AssetsBucket
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
            BucketKeyEnabled: true
      VersioningConfiguration:
        Status: Enabled
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      Tags:
        - { Key: Name, Value: !Ref AssetsBucket }
        - { Key: Environment, Value: !Ref EnvironmentName }

  # ---------------------------------------------------------------- security

  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "Porter ALB ingress (${EnvironmentName}) - CIDR allowlist only"
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: !Ref AllowedClientCidr1
          Description: Allowed client CIDR 1
        - !If
          - HasCidr2
          - IpProtocol: tcp
            FromPort: 80
            ToPort: 80
            CidrIp: !Ref AllowedClientCidr2
            Description: Allowed client CIDR 2
          - !Ref AWS::NoValue
        - !If
          - HasCidr3
          - IpProtocol: tcp
            FromPort: 80
            ToPort: 80
            CidrIp: !Ref AllowedClientCidr3
            Description: Allowed client CIDR 3
          - !Ref AWS::NoValue
      Tags:
        - { Key: Name, Value: !Sub "porter-${EnvironmentName}-alb-sg" }

  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "Porter Fargate tasks (${EnvironmentName}) - ALB only"
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId: !Ref AlbSecurityGroup
          Description: Porter HTTP from ALB
      Tags:
        - { Key: Name, Value: !Sub "porter-${EnvironmentName}-task-sg" }

  # -------------------------------------------------------------------- logs

  PorterLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/ecs/porter/${EnvironmentName}"
      RetentionInDays: !Ref LogRetentionInDays

  # --------------------------------------------------------------------- iam

  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "porter-${EnvironmentName}-execution-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy"
      Policies:
        - PolicyName: porter-log-writes
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/ecs/porter/${EnvironmentName}:*"

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "porter-${EnvironmentName}-task-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: porter-assets-read
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource: !Sub "arn:${AWS::Partition}:s3:::${AssetsBucketName}"
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub "arn:${AWS::Partition}:s3:::${AssetsBucketName}/*"
        - !If
          - HasOutputBucket
          - PolicyName: porter-output-bucket
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action:
                    - s3:ListBucket
                    - s3:GetBucketLocation
                  Resource: !Sub "arn:${AWS::Partition}:s3:::${OutputBucketName}"
                - Effect: Allow
                  Action:
                    - s3:GetObject
                    - s3:PutObject
                    - s3:AbortMultipartUpload
                  Resource: !Sub "arn:${AWS::Partition}:s3:::${OutputBucketName}/*"
          - !Ref AWS::NoValue
        - PolicyName: porter-ecs-exec
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ssmmessages:CreateControlChannel
                  - ssmmessages:CreateDataChannel
                  - ssmmessages:OpenControlChannel
                  - ssmmessages:OpenDataChannel
                Resource: "*"

  # --------------------------------------------------------------------- alb

  PorterLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "porter-${EnvironmentName}-alb"
      Type: application
      Scheme: internet-facing
      IpAddressType: ipv4
      SecurityGroups: [!Ref AlbSecurityGroup]
      Subnets:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2
      LoadBalancerAttributes:
        - { Key: idle_timeout.timeout_seconds, Value: "120" }
        - { Key: routing.http.drop_invalid_header_fields.enabled, Value: "true" }
      Tags:
        - { Key: Environment, Value: !Ref EnvironmentName }

  PorterTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "porter-${EnvironmentName}-tg"
      VpcId: !Ref Vpc
      Port: 80
      Protocol: HTTP
      TargetType: ip
      HealthCheckEnabled: true
      HealthCheckProtocol: HTTP
      HealthCheckPath: !Ref HealthCheckPath
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 10
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 5
      Matcher:
        HttpCode: !Ref HealthCheckMatcher
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: "30" }

  PorterHttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref PorterLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref PorterTargetGroup

  # --------------------------------------------------------------------- ecs

  EcsCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "porter-${EnvironmentName}"
      ClusterSettings:
        - { Name: containerInsights, Value: enabled }
      Tags:
        - { Key: Environment, Value: !Ref EnvironmentName }

  PorterTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "porter-${EnvironmentName}"
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ContainerDefinitions:
        - Name: porter
          Image: !Ref PorterImageUri
          Essential: true
          PortMappings:
            - ContainerPort: 80
              Protocol: tcp
          Environment:
            - { Name: LISTEN_ADDR, Value: "0.0.0.0:80" }
            - { Name: METRICS_LISTEN_ADDR, Value: "127.0.0.1:9000" }
            - { Name: PRETTY_LOG, Value: "false" }
            - { Name: CORS_ORIGIN, Value: !Ref CorsOrigin }
            - { Name: BLOCK_CACHE_SIZE, Value: !Ref BlockCacheSize }
            - { Name: BASE_URL, Value: !Sub "http://${PorterLoadBalancer.DNSName}" }
            - Name: LAYER_CONFIG_URI
              Value: !Sub "s3://${AssetsBucketName}/${LayerConfigPrefix}"
            - { Name: AWS_REGION, Value: !Ref AWS::Region }
          Ulimits:
            - { Name: nofile, SoftLimit: 65536, HardLimit: 65536 }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref PorterLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: porter

  PorterService:
    Type: AWS::ECS::Service
    DependsOn:
      - PorterHttpListener
      - PrivateDefaultRoute1
      - PrivateDefaultRoute2
    Properties:
      ServiceName: !Sub "porter-${EnvironmentName}"
      Cluster: !Ref EcsCluster
      TaskDefinition: !Ref PorterTaskDefinition
      LaunchType: FARGATE
      PlatformVersion: LATEST
      DesiredCount: !Ref DesiredCount
      EnableExecuteCommand: true
      PropagateTags: SERVICE
      HealthCheckGracePeriodSeconds: 120
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets:
            - !Ref PrivateSubnet1
            - !Ref PrivateSubnet2
          SecurityGroups:
            - !Ref TaskSecurityGroup
      LoadBalancers:
        - ContainerName: porter
          ContainerPort: 80
          TargetGroupArn: !Ref PorterTargetGroup
      Tags:
        - { Key: Environment, Value: !Ref EnvironmentName }

Outputs:

  PorterUrl:
    Description: Porter base URL (HTTP only - no TLS on this listener).
    Value: !Sub "http://${PorterLoadBalancer.DNSName}"
    Export:
      Name: !Sub "porter-${EnvironmentName}-PorterUrl"

  PorterAlbDnsName:
    Description: ALB DNS name.
    Value: !GetAtt PorterLoadBalancer.DNSName
    Export:
      Name: !Sub "porter-${EnvironmentName}-PorterAlbDnsName"

  LayerConfigUri:
    Description: S3 URI Porter reads layer configs from.
    Value: !Sub "s3://${AssetsBucketName}/${LayerConfigPrefix}"
    Export:
      Name: !Sub "porter-${EnvironmentName}-LayerConfigUri"

  TaskRoleArn:
    Description: Porter task role ARN.
    Value: !GetAtt TaskRole.Arn
    Export:
      Name: !Sub "porter-${EnvironmentName}-TaskRoleArn"

  AssetsBucketName:
    Description: Assets bucket in use (created or referenced).
    Value: !Ref AssetsBucket
    Export:
      Name: !Sub "porter-${EnvironmentName}-AssetsBucket"

  EcsClusterName:
    Description: ECS cluster name (for ecs execute-command).
    Value: !Ref EcsCluster

  EcsServiceName:
    Description: ECS service name (for forced redeploys).
    Value: !GetAtt PorterService.Name

  VpcId:
    Description: VPC created by this stack.
    Value: !Ref Vpc
