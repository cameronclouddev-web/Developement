AWSTemplateFormatVersion: "2010-09-09"

Description: >-
  Porter stack 1 of 3 - NETWORK. Creates a 2-AZ VPC, public and private subnets,
  internet gateway, NAT egress, and an S3 gateway endpoint. Exports subnet and
  VPC IDs for the platform and service stacks. Depends on nothing.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: "Environment" }
        Parameters: [EnvironmentName, VpcCidr, HighAvailabilityNat]

Parameters:
  EnvironmentName:
    Type: String
    AllowedValues: [test, prod]
    Description: Deployment tier. Used in resource names, tags, and export names.

  VpcCidr:
    Type: String
    Default: 10.60.0.0/16
    AllowedPattern: ^(\d{1,3}\.){3}\d{1,3}/(1[6-9]|2[0-2])$
    Description: >-
      VPC CIDR, /16 to /22. Four equal /24 subnets are carved from it,
      so anything smaller than /22 will not fit.

  HighAvailabilityNat:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >-
      false = one NAT gateway (cheaper, single point of failure for egress).
      true = one NAT gateway per AZ. Recommend true for prod.

Conditions:
  MultiNat: !Equals [!Ref HighAvailabilityNat, "true"]

Resources:

  # ------------------------------------------------------------------ network

  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - { Key: Name, Value: !Sub "porter-${EnvironmentName}-vpc" }

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - { Key: Name, Value: !Sub "porter-${EnvironmentName}-igw" }

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Select [0, !Cidr [!Ref VpcCidr, 4, 8]]
      MapPublicIpOnLaunch: true
      Tags:
        - { Key: Name, Value: !Sub "porter-${EnvironmentName}-public-1" }

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Select [1, !Cidr [!Ref VpcCidr, 4, 8]]
      MapPublicIpOnLaunch: true
      Tags:
        - { Key: Name, Value: !Sub "porter-${EnvironmentName}-public-2" }

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Select [2, !Cidr [!Ref VpcCidr, 4, 8]]
      Tags:
        - { Key: Name, Value: !Sub "porter-${EnvironmentName}-private-1" }

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Select [3, !Cidr [!Ref VpcCidr, 4, 8]]
      Tags:
        - { Key: Name, Value: !Sub "porter-${EnvironmentName}-private-2" }

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - { Key: Name, Value: !Sub "porter-${EnvironmentName}-public-rt" }

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  NatEip1:
    Type: AWS::EC2::EIP
    DependsOn: InternetGatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - { Key: Name, Value: !Sub "porter-${EnvironmentName}-nat-eip-1" }

  NatGateway1:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEip1.AllocationId
      SubnetId: !Ref PublicSubnet1
      Tags:
        - { Key: Name, Value: !Sub "porter-${EnvironmentName}-nat-1" }

  NatEip2:
    Type: AWS::EC2::EIP
    Condition: MultiNat
    DependsOn: InternetGatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - { Key: Name, Value: !Sub "porter-${EnvironmentName}-nat-eip-2" }

  NatGateway2:
    Type: AWS::EC2::NatGateway
    Condition: MultiNat
    Properties:
      AllocationId: !GetAtt NatEip2.AllocationId
      SubnetId: !Ref PublicSubnet2
      Tags:
        - { Key: Name, Value: !Sub "porter-${EnvironmentName}-nat-2" }

  PrivateRouteTable1:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - { Key: Name, Value: !Sub "porter-${EnvironmentName}-private-rt-1" }

  PrivateRouteTable2:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - { Key: Name, Value: !Sub "porter-${EnvironmentName}-private-rt-2" }

  PrivateDefaultRoute1:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable1
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway1

  PrivateDefaultRoute2:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable2
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !If [MultiNat, !Ref NatGateway2, !Ref NatGateway1]

  PrivateSubnet1RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable1

  PrivateSubnet2RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable2

  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref PrivateRouteTable1
        - !Ref PrivateRouteTable2

Outputs:

  VpcId:
    Description: VPC created by this stack.
    Value: !Ref Vpc
    Export:
      Name: !Sub "porter-${EnvironmentName}-VpcId"

  PublicSubnet1Id:
    Description: Public subnet in AZ 1 (ALB).
    Value: !Ref PublicSubnet1
    Export:
      Name: !Sub "porter-${EnvironmentName}-PublicSubnet1Id"

  PublicSubnet2Id:
    Description: Public subnet in AZ 2 (ALB).
    Value: !Ref PublicSubnet2
    Export:
      Name: !Sub "porter-${EnvironmentName}-PublicSubnet2Id"

  PrivateSubnet1Id:
    Description: Private subnet in AZ 1 (Fargate tasks).
    Value: !Ref PrivateSubnet1
    Export:
      Name: !Sub "porter-${EnvironmentName}-PrivateSubnet1Id"

  PrivateSubnet2Id:
    Description: Private subnet in AZ 2 (Fargate tasks).
    Value: !Ref PrivateSubnet2
    Export:
      Name: !Sub "porter-${EnvironmentName}-PrivateSubnet2Id"

  NatEgressReady:
    Description: >-
      Marker export proving the private default routes exist. The service stack
      imports this so tasks are never launched before NAT egress is available.
    Value: !Sub "${PrivateDefaultRoute1}-${PrivateDefaultRoute2}"
    Export:
      Name: !Sub "porter-${EnvironmentName}-NatEgressReady"
